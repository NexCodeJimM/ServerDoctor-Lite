name: ServerDoctor
version: '0.9.0-BETA'
main: com.jimm.serverdoctor.ServerDoctorPlugin
description: ServerDoctor Lite - server health reports and chunk analysis
author: jimm
api-version: '26.1.2'

permissions:
  serverdoctor.use:
    description: Use /doctor and /doctor help for quick server stats
    default: true
  serverdoctor.report:
    description: Use /doctor report for a full health report with warnings
    default: op
  serverdoctor.alerts:
    description: Use /doctor alerts, /doctor discord, and receive automatic health alert messages
    default: op
  serverdoctor.export:
    description: Use /doctor export to save a text report file
    default: op
  serverdoctor.reload:
    description: Use /doctor reload to reload config.yml without restarting
    default: op
  serverdoctor.chunks:
    description: Use /doctor chunks to analyze the heaviest loaded chunks
    default: op
  serverdoctor.tpchunk:
    description: Click chunk locations in /doctor chunks to teleport, or use /doctor tpchunk
    default: op
  serverdoctor.cleanup.preview:
    description: Use /doctor cleanup preview to scan entities without removing anything
    default: op
  serverdoctor.cleanup.confirm:
    description: Use /doctor cleanup confirm to remove configured entities from loaded worlds
    default: op
  serverdoctor.spikes:
    description: Use /doctor spikes to view lag spike detection status
    default: op
  serverdoctor.status:
    description: Use /doctor status for a quick overall server health summary
    default: op
  serverdoctor.about:
    description: Use /doctor about to view plugin version and information
    default: true
