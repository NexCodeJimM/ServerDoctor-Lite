name: ServerDoctor
version: '0.9.1-BETA'
main: com.jimm.serverdoctor.ServerDoctorPlugin
description: ServerDoctor Lite - server health reports and chunk analysis
author: jimm
api-version: '1.21'

commands:
  doctor:
    description: ServerDoctor diagnostic and health commands
    usage: /doctor [subcommand]
    aliases: []

permissions:
  serverdoctor.use:
    description: Use /doctor and /doctor help for quick server stats
    default: true
  serverdoctor.report:
    description: Use /doctor report for a full health report with warnings
    default: op
  serverdoctor.alerts:
    description: Use /doctor alerts, /doctor discord, and receive automatic health alert messages
    default: op
  serverdoctor.export:
    description: Use /doctor export to save a text report file
    default: op
  serverdoctor.reload:
    description: Use /doctor reload to reload config.yml without restarting
    default: op
  serverdoctor.chunks:
    description: Use /doctor chunks to analyze the heaviest loaded chunks
    default: op
  serverdoctor.tpchunk:
    description: Click chunk locations in /doctor chunks to teleport, or use /doctor tpchunk
    default: op
  serverdoctor.cleanup.preview:
    description: Use /doctor cleanup preview to scan entities without removing anything
    default: op
  serverdoctor.cleanup.confirm:
    description: Use /doctor cleanup confirm to remove configured entities from loaded worlds
    default: op
  serverdoctor.spikes:
    description: Use /doctor spikes to view lag spike detection status
    default: op
  serverdoctor.status:
    description: Use /doctor status for a quick overall server health summary
    default: op
  serverdoctor.about:
    description: Use /doctor about to view plugin version and information
    default: true
  serverdoctor.update.notify:
    description: See /doctor update status and receive notifications when a newer version is on SpigotMC
    default: op
  serverdoctor.update.check:
    description: Use /doctor update check to manually check SpigotMC for updates
    default: op
  serverdoctor.plugins:
    description: Use /doctor plugins to scan installed plugins for possible performance review areas
    default: op
  serverdoctor.history:
    description: Use /doctor history for performance history overview and trends
    default: op
  serverdoctor.history.spikes:
    description: Use /doctor history spikes to view recent lag spike history
    default: op
  serverdoctor.history.performance:
    description: Use /doctor history performance for rolling performance averages and trends
    default: op
  serverdoctor.schedule:
    description: Use /doctor schedule to view scheduled diagnostic report settings
    default: op
